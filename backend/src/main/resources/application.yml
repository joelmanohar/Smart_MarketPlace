server:
  port: 8080

spring:
  application:
    name: smartmarket-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartmarket}
    username: ${DB_USERNAME:smartmarket}
    password: ${DB_PASSWORD:smartmarket}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null

app:
  search:
    block-size: 4
    processors: 8
