version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartmarket-postgres
    environment:
      POSTGRES_DB: smartmarket
      POSTGRES_USER: smartmarket
      POSTGRES_PASSWORD: smartmarket
    ports:
      - "5432:5432"
    volumes:
      - smartmarket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmarket -d smartmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartmarket_pgdata:
